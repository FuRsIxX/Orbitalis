plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Dossier de compilation à part (-Porbitalis.altBuild=true) : pour compiler, tester ou déployer pendant qu'un client
// lancé par « gradlew runClient » tourne. Ce client lit ses classes dans build/ au fil de l'eau : les y remplacer
// sous ses pieds le fait planter (NoClassDefFoundError). Ici, build/ n'est pas touché.
if (providers.gradleProperty('orbitalis.altBuild').isPresent()) {
    layout.buildDirectory = layout.projectDirectory.dir('build-alt')
}

sourceSets.main.resources {
    // Inclut les ressources produites par le datagen.
    srcDir('src/generated/resources')

    // Exclut des fichiers finaux ce qui ne sert qu'au développement.
    exclude("**/*.bbmodel")   // projets Blockbench
    exclude("**/.gitkeep")    // marqueurs de dossiers vides
    exclude("**/.cache/**")   // cache du datagen
}

repositories {
    // GeckoLib (via le Maven de Modrinth, limité au groupe maven.modrinth).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    // JEI et sa bibliothèque de configuration.
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com/'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

// Minecraft 26.2 est livré avec Java 25 : le mod cible donc Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        // Client de développement : gradlew runClient
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Iris posé dans run/mods (essais sous shaders) : en développement, le jeu vérifie chaque dessin, et cette
            // vérification ne connaît pas les pipelines d'Iris : elle plante dès qu'un shader est actif. On la coupe
            // donc tant qu'Iris est là ; elle n'existe de toute façon pas dans le jeu normal.
            if (file('run/mods').exists() && file('run/mods').listFiles().any { it.name.startsWith('iris') }) {
                systemProperty 'neoforge.disableGlValidation', 'true'
            }
            // Outil de développement : gradlew runClient -Porbitalis.guidePreview=true
            // ouvre le monde run/saves/orbitalis_preview, capture des images du manuel
            // dans run/guide_preview, puis ferme le jeu.
            if (project.hasProperty('orbitalis.guidePreview')) {
                systemProperty 'orbitalis.guidePreview', 'true'
                if (project.hasProperty('orbitalis.guideResearchOnly')) {
                    systemProperty 'orbitalis.guideResearchOnly', 'true'
                }
                // -Porbitalis.previewWorld=nom choisit un autre monde, si celui-ci est ouvert ailleurs.
                programArguments.addAll '--quickPlaySingleplayer', (project.findProperty('orbitalis.previewWorld') ?: 'orbitalis_preview')
            }
            // Même principe pour le rendu dans le monde : gradlew runClient -Porbitalis.worldPreview=true
            // ouvre le monde run/saves/orbitalis_render, y bâtit une scène de démonstration, la capture sous plusieurs
            // angles dans run/world_preview, puis ferme le jeu.
            if (project.hasProperty('orbitalis.worldPreview')) {
                systemProperty 'orbitalis.worldPreview', 'true'
                // -Porbitalis.previewOnly=vue1,vue2 ne prend que ces vues-là (et ne prépare que leurs scènes).
                if (project.hasProperty('orbitalis.previewOnly')) {
                    systemProperty 'orbitalis.previewOnly', project.property('orbitalis.previewOnly')
                }
                // -Porbitalis.previewWorld=nom ouvre un autre monde (la carte de test, par exemple).
                programArguments.addAll '--quickPlaySingleplayer', (project.findProperty('orbitalis.previewWorld') ?: 'orbitalis_render')
            }
        }

        // Serveur dédié de développement (tests multijoueur) : gradlew runServer
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Carte de test : gradlew deployTestMap. Un serveur sans fenêtre crée un monde plat neuf dans run/testmap, y bâtit
        // tout ce que le mod ajoute (voir TestMap), puis s'arrête ; la carte est ensuite copiée dans l'instance CurseForge.
        testMap {
            server()
            programArgument '--nogui'
            gameDirectory = file('run/testmap')
            systemProperty 'orbitalis.testMap', 'true'
        }

        // Tests automatisés en jeu : gradlew runGameTestServer
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Génération des données (recettes, loot tables, tags, modèles, traductions) : gradlew runData
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    // Dépendances présentes en développement mais non imposées aux utilisateurs du mod.
    runtimeClasspath.extendsFrom localRuntime

    // Mods tiers copiés dans l'instance CurseForge de test avec le jar d'Orbitalis.
    curseforgeMods {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // GeckoLib : dépendance obligatoire (entités et blocs animés).
    implementation "maven.modrinth:geckolib:${geckolib_file_id}"

    // JEI : API à la compilation, mod complet uniquement pour les tests en développement.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Mods tiers déployés dans l'instance CurseForge.
    curseforgeMods "maven.modrinth:geckolib:${geckolib_file_id}"
    curseforgeMods "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// Remplace les variables ${...} du fichier neoforge.mods.toml par les valeurs de gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            geckolib_version       : geckolib_version,
            jei_version            : jei_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Compile le mod puis le copie, avec GeckoLib et JEI, dans le dossier mods de l'instance CurseForge.
// Usage : gradlew deployCurseForge, puis lancer l'instance depuis l'application CurseForge.
def curseforgeInstanceDir = providers.gradleProperty('curseforge_instance_dir')
        .orElse(providers.systemProperty('user.home').map { "${it}/curseforge/minecraft/Instances/Orbitalis" })

tasks.register('deployCurseForge', Copy) {
    group = 'orbitalis'
    description = "Copie le jar d'Orbitalis et ses dépendances dans l'instance CurseForge de test."
    from tasks.named('jar')
    from configurations.curseforgeMods
    into curseforgeInstanceDir.map { "${it}/mods" }
    // Une seule version d'Orbitalis à la fois dans l'instance : deux jars du mod empêcheraient le jeu de démarrer.
    def modsDir = curseforgeInstanceDir.map { file("${it}/mods") }
    def current = "orbitalis-${project.version}.jar"
    doFirst {
        def dir = modsDir.get()
        if (dir.exists()) {
            dir.listFiles().findAll { it.name ==~ /orbitalis-.*\.jar/ && it.name != current }.each { it.delete() }
        }
    }
}

// La carte de test : un monde plat neuf à chaque fois, bâti par le serveur, puis copié dans les mondes de l'instance.
def testMapName = 'Orbitalis - Carte de test'
def testMapDir = file('run/testmap')
tasks.register('prepareTestMap') {
    group = 'orbitalis'
    description = 'Prépare un serveur neuf pour la carte de test : monde plat, créatif, paisible.'
    def dir = testMapDir
    def worldName = testMapName
    doLast {
        def world = new File(dir, worldName)
        if (world.exists()) {
            world.deleteDir()
        }
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = [
                "level-name=${worldName}",
                'level-type=minecraft\\:flat',
                'generate-structures=false',
                'gamemode=creative',
                'difficulty=peaceful',
                'spawn-monsters=false',
                'online-mode=false',
                'spawn-protection=0',
                'motd=Orbitalis - carte de test',
        ].join('\n') + '\n'
    }
}
tasks.matching { it.name == 'runTestMap' }.configureEach { dependsOn 'prepareTestMap' }
// La carte bâtie est copiée à deux endroits : dans l'instance CurseForge, et dans run/saves, où la trouve le jeu lancé
// par gradlew runClient.
[deployTestMap     : ["l'instance CurseForge", curseforgeInstanceDir.map { "${it}/saves/${testMapName}" }],
 deployTestMapLocal: ['run/saves (gradlew runClient)', providers.provider { file("run/saves/${testMapName}").absolutePath }]].each { taskName, spec ->
    def (where, target) = spec
    tasks.register(taskName, Sync) {
        group = 'orbitalis'
        description = "Bâtit la carte de test et la copie dans les mondes de ${where}."
        dependsOn 'runTestMap'
        from file("run/testmap/${testMapName}")
        into target
        exclude 'session.lock'
        // Jamais pendant qu'on y joue : si la carte est ouverte dans le jeu, son verrou est pris, et on la laisse telle quelle.
        def lockFile = target.map { new File(it, 'session.lock') }
        onlyIf {
            def lock = lockFile.get()
            if (!lock.exists()) {
                return true
            }
            def channel = new RandomAccessFile(lock, 'rw').channel
            try {
                def held = channel.tryLock()
                if (held == null) {
                    System.out.println("La carte de test est ouverte dans le jeu (${where}) : elle n'est pas remplacée.")
                    return false
                }
                held.release()
                return true
            } catch (Exception ignored) {
                System.out.println("La carte de test est ouverte dans le jeu (${where}) : elle n'est pas remplacée.")
                return false
            } finally {
                channel.close()
            }
        }
    }
}
// Chaque déploiement remet la carte de test à jour, aux deux endroits.
tasks.named('deployCurseForge') { finalizedBy 'deployTestMap', 'deployTestMapLocal' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
