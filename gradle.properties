# ---------------------------------------------------------------------------
# Réglages Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---------------------------------------------------------------------------
# Versions de l'environnement (vérifiées le 04/10/2026)
# ---------------------------------------------------------------------------
# La version de Minecraft doit correspondre à celle de NeoForge.
minecraft_version=26.2
minecraft_version_range=[26.2]
# Dernière version stable de NeoForge pour Minecraft 26.2.
neo_version=26.2.0.88

# ---------------------------------------------------------------------------
# Dépendances
# ---------------------------------------------------------------------------
# JEI (affichage des recettes), dépendance optionnelle.
jei_version=30.39.0.232

# ---------------------------------------------------------------------------
# Propriétés du mod
# ---------------------------------------------------------------------------
# Identifiant unique du mod. Doit correspondre à la constante Orbitalis.MODID.
mod_id=orbitalis
mod_name=Orbitalis
mod_license=All Rights Reserved
mod_version=0.9.0
mod_group_id=com.orbitalis
mod_authors=the-simimoune

# ---------------------------------------------------------------------------
# Instance CurseForge de test (tâche deployCurseForge)
# ---------------------------------------------------------------------------
# Par défaut : <dossier utilisateur>/curseforge/minecraft/Instances/Orbitalis
# Pour utiliser une autre instance, décommenter et adapter la ligne suivante :
# curseforge_instance_dir=C:/chemin/vers/l/instance
